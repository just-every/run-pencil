name: Verify candidate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '23 16 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm verify:base && pnpm verify:cli && pnpm verify:manifest && pnpm verify:boundaries && pnpm source:check
      - name: Install the maintained publication scanner
        run: |
          bash scripts/install-gitleaks.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm verify:publication
        env:
          GH_TOKEN: ${{ github.token }}

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [unit, worker-1, worker-2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - name: Build the production Worker for native Managed mail proof
        if: matrix.lane == 'unit'
        run: pnpm build:delivery
      - name: Prove complete archive and attachment custody
        if: matrix.lane == 'unit'
        run: node --test --test-concurrency=2 scripts/deployment-data.check.mjs
      - name: Prove all released migration cases
        if: matrix.lane == 'worker-1'
        run: pnpm verify:migrations
      - run: node scripts/run-contract-lane.mjs "${{ matrix.lane }}" "$RUNNER_TEMP/contract-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-${{ matrix.lane }}
          path: ${{ runner.temp }}/contract-evidence/*.json
          if-no-files-found: error
          retention-days: 1

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [desktop-1, desktop-2, desktop-3, desktop-4, desktop-5, desktop-6, desktop-7, desktop-8, mobile-1, mobile-2, mobile-3, mobile-4, mobile-5, mobile-6, mobile-7, mobile-8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium with apt mirror fallback
        run: |
          # The runner's default Azure mirror can serve package indexes while
          # its package downloads hang, so retrying the same host does not
          # help: attempts 2 and 3 use other mirrors of the same Ubuntu-signed
          # archive (apt still verifies every Release signature). Same mirror
          # order and attempt budget as Base's verify workflow.
          mirrors=(runner-default http://mirrors.edge.kernel.org/ubuntu http://us-east-1.ec2.archive.ubuntu.com/ubuntu)
          started=$SECONDS
          for attempt in 1 2 3; do
            mirror=${mirrors[attempt - 1]}
            if [[ $mirror != runner-default ]]; then
              sudo sed -i -E "s@^(URIs:[[:space:]]*)(mirror\+file:/etc/apt/apt-mirrors\.txt|https?://(([a-z0-9.-]+\.)?archive\.ubuntu\.com|security\.ubuntu\.com|mirrors\.edge\.kernel\.org)/ubuntu/?)@\1${mirror}/@" /etc/apt/sources.list.d/ubuntu.sources
            fi
            printf 'Chromium apt: attempt %s/3 (90s deadline; mirror %s; sources %s)\n' "$attempt" "$mirror" "$(grep -h '^URIs:' /etc/apt/sources.list.d/ubuntu.sources | sort -u | tr '\n' ' ')"
            if timeout --kill-after=5s 90s bash -ec '
              sudo dpkg --configure -a
              pnpm exec playwright install-deps chromium
            '; then
              printf 'Chromium apt: complete (attempts=%s mirror=%s seconds=%s)\n' "$attempt" "$mirror" "$((SECONDS - started))"
              break
            else
              status=$?
              printf 'Chromium apt: attempt %s/3 failed (mirror %s, exit %s, seconds=%s)\n' "$attempt" "$mirror" "$status" "$((SECONDS - started))" >&2
            fi
            if (( attempt == 3 )); then exit "$status"; fi
            sleep "$((attempt * 2))"
          done
          pnpm exec playwright install chromium
      # Each shard still owns fresh migrated runtimes and the original rate limits.
      - run: node scripts/run-contract-lane.mjs "${{ matrix.lane }}" "$RUNNER_TEMP/contract-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-${{ matrix.lane }}
          path: ${{ runner.temp }}/contract-evidence/*.json
          if-no-files-found: error
          retention-days: 1

  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium with apt mirror fallback
        run: |
          # The runner's default Azure mirror can serve package indexes while
          # its package downloads hang, so retrying the same host does not
          # help: attempts 2 and 3 use other mirrors of the same Ubuntu-signed
          # archive (apt still verifies every Release signature). Same mirror
          # order and attempt budget as Base's verify workflow.
          mirrors=(runner-default http://mirrors.edge.kernel.org/ubuntu http://us-east-1.ec2.archive.ubuntu.com/ubuntu)
          started=$SECONDS
          for attempt in 1 2 3; do
            mirror=${mirrors[attempt - 1]}
            if [[ $mirror != runner-default ]]; then
              sudo sed -i -E "s@^(URIs:[[:space:]]*)(mirror\+file:/etc/apt/apt-mirrors\.txt|https?://(([a-z0-9.-]+\.)?archive\.ubuntu\.com|security\.ubuntu\.com|mirrors\.edge\.kernel\.org)/ubuntu/?)@\1${mirror}/@" /etc/apt/sources.list.d/ubuntu.sources
            fi
            printf 'Chromium apt: attempt %s/3 (90s deadline; mirror %s; sources %s)\n' "$attempt" "$mirror" "$(grep -h '^URIs:' /etc/apt/sources.list.d/ubuntu.sources | sort -u | tr '\n' ' ')"
            if timeout --kill-after=5s 90s bash -ec '
              sudo dpkg --configure -a
              pnpm exec playwright install-deps chromium
            '; then
              printf 'Chromium apt: complete (attempts=%s mirror=%s seconds=%s)\n' "$attempt" "$mirror" "$((SECONDS - started))"
              break
            else
              status=$?
              printf 'Chromium apt: attempt %s/3 failed (mirror %s, exit %s, seconds=%s)\n' "$attempt" "$mirror" "$status" "$((SECONDS - started))" >&2
            fi
            if (( attempt == 3 )); then exit "$status"; fi
            sleep "$((attempt * 2))"
          done
          pnpm exec playwright install chromium
      - run: pnpm verify:admission

  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium with apt mirror fallback
        run: |
          # The runner's default Azure mirror can serve package indexes while
          # its package downloads hang, so retrying the same host does not
          # help: attempts 2 and 3 use other mirrors of the same Ubuntu-signed
          # archive (apt still verifies every Release signature). Same mirror
          # order and attempt budget as Base's verify workflow.
          mirrors=(runner-default http://mirrors.edge.kernel.org/ubuntu http://us-east-1.ec2.archive.ubuntu.com/ubuntu)
          started=$SECONDS
          for attempt in 1 2 3; do
            mirror=${mirrors[attempt - 1]}
            if [[ $mirror != runner-default ]]; then
              sudo sed -i -E "s@^(URIs:[[:space:]]*)(mirror\+file:/etc/apt/apt-mirrors\.txt|https?://(([a-z0-9.-]+\.)?archive\.ubuntu\.com|security\.ubuntu\.com|mirrors\.edge\.kernel\.org)/ubuntu/?)@\1${mirror}/@" /etc/apt/sources.list.d/ubuntu.sources
            fi
            printf 'Chromium apt: attempt %s/3 (90s deadline; mirror %s; sources %s)\n' "$attempt" "$mirror" "$(grep -h '^URIs:' /etc/apt/sources.list.d/ubuntu.sources | sort -u | tr '\n' ' ')"
            if timeout --kill-after=5s 90s bash -ec '
              sudo dpkg --configure -a
              pnpm exec playwright install-deps chromium
            '; then
              printf 'Chromium apt: complete (attempts=%s mirror=%s seconds=%s)\n' "$attempt" "$mirror" "$((SECONDS - started))"
              break
            else
              status=$?
              printf 'Chromium apt: attempt %s/3 failed (mirror %s, exit %s, seconds=%s)\n' "$attempt" "$mirror" "$status" "$((SECONDS - started))" >&2
            fi
            if (( attempt == 3 )); then exit "$status"; fi
            sleep "$((attempt * 2))"
          done
          pnpm exec playwright install chromium
      - run: pnpm build:app
      - run: node scripts/verify-hosted-output.mjs

  journeys:
    # Slow copied-checkout installer and README journeys retain their complete
    # assertions nightly and on release tags, outside the push budget.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium with apt mirror fallback
        run: |
          # The runner's default Azure mirror can serve package indexes while
          # its package downloads hang, so retrying the same host does not
          # help: attempts 2 and 3 use other mirrors of the same Ubuntu-signed
          # archive (apt still verifies every Release signature). Same mirror
          # order and attempt budget as Base's verify workflow.
          mirrors=(runner-default http://mirrors.edge.kernel.org/ubuntu http://us-east-1.ec2.archive.ubuntu.com/ubuntu)
          started=$SECONDS
          for attempt in 1 2 3; do
            mirror=${mirrors[attempt - 1]}
            if [[ $mirror != runner-default ]]; then
              sudo sed -i -E "s@^(URIs:[[:space:]]*)(mirror\+file:/etc/apt/apt-mirrors\.txt|https?://(([a-z0-9.-]+\.)?archive\.ubuntu\.com|security\.ubuntu\.com|mirrors\.edge\.kernel\.org)/ubuntu/?)@\1${mirror}/@" /etc/apt/sources.list.d/ubuntu.sources
            fi
            printf 'Chromium apt: attempt %s/3 (90s deadline; mirror %s; sources %s)\n' "$attempt" "$mirror" "$(grep -h '^URIs:' /etc/apt/sources.list.d/ubuntu.sources | sort -u | tr '\n' ' ')"
            if timeout --kill-after=5s 90s bash -ec '
              sudo dpkg --configure -a
              pnpm exec playwright install-deps chromium
            '; then
              printf 'Chromium apt: complete (attempts=%s mirror=%s seconds=%s)\n' "$attempt" "$mirror" "$((SECONDS - started))"
              break
            else
              status=$?
              printf 'Chromium apt: attempt %s/3 failed (mirror %s, exit %s, seconds=%s)\n' "$attempt" "$mirror" "$status" "$((SECONDS - started))" >&2
            fi
            if (( attempt == 3 )); then exit "$status"; fi
            sleep "$((attempt * 2))"
          done
          pnpm exec playwright install chromium
      - name: Reclaim unused SDK space for real local runtimes
        run: |
          df -h . /tmp
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android
          df -h . /tmp
      - run: pnpm verify:setup

  verify:
    if: always()
    needs: [checks, runtime, browser, admission, hosted, journeys]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification lane
        env:
          VERIFICATION_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const lanes = Object.entries(JSON.parse(process.env.VERIFICATION_RESULTS)); if (lanes.some(([name, lane]) => lane.result !== "success" && !(name === "journeys" && lane.result === "skipped"))) process.exit(1)'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: contract-*
          path: ${{ runner.temp }}/contract-evidence
          merge-multiple: true
      - name: Evaluate the complete existing contract wall from this run
        run: pnpm verify:contract
        env:
          PENCIL_CONTRACT_EVIDENCE_DIR: ${{ runner.temp }}/contract-evidence
