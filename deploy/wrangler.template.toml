name = "pencil-local"
main = "src/server.ts"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "pencil-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations/core"

[assets]
binding = "ASSETS"
run_worker_first = true

# Retain anonymous metrics and dispatch due durable invitations/reminders.
[triggers]
crons = ["* * * * *"]

# Configure supplies these values for hosted mail; Managed assigns all three.
[vars]
MAIL_PROVIDER = "resend"
MAIL_FROM = ""
MAIL_RELAY_URL = ""
