<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 300" preserveAspectRatio="xMidYMax slice">
  <!-- Pencil's floor art for the Lobby: paper sheets in the landing's palette (src/core/features/site/styles/tokens.css),
       a pencil-yellow ribbon, and the graphite line that forks, as it does between the homepage's sections. -->
  <defs>
    <linearGradient id="sheet" x1="0" x2="1"><stop offset="0" stop-color="#f2f0e9"/><stop offset=".55" stop-color="#f6f4ee"/><stop offset="1" stop-color="#eeebe2"/></linearGradient>
    <linearGradient id="wash" x1="0" x2="1"><stop offset="0" stop-color="#fcefc9"/><stop offset=".5" stop-color="#f9d272"/><stop offset="1" stop-color="#fcefc9"/></linearGradient>
    <linearGradient id="ribbon" x1="0" x2="1"><stop offset="0" stop-color="#c98a12"/><stop offset=".45" stop-color="#f2b33d"/><stop offset="1" stop-color="#d99a1f"/></linearGradient>
    <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e9e5da"/><stop offset="1" stop-color="#dcd6c8"/></linearGradient>
  </defs>
  <path d="M0 118 C 280 78 520 168 780 148 S 1210 54 1440 78 V300 H0 Z" fill="#f4f2ec"/>
  <path d="M0 148 C 300 110 540 196 800 176 S 1210 92 1440 112 V300 H0 Z" fill="url(#sheet)"/>
  <path d="M0 142 C 300 104 540 190 800 170 S 1210 86 1440 106" fill="none" stroke="#5f646b" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
  <path d="M0 186 C 330 150 560 232 820 206 S 1220 128 1440 146 V300 H0 Z" fill="url(#wash)" opacity=".85"/>
  <path d="M0 204 C 340 168 580 250 840 222 S 1230 146 1440 164 V300 H0 Z" fill="url(#ribbon)"/>
  <path d="M0 200 C 340 164 580 246 840 218 S 1230 142 1440 160" fill="none" stroke="#1e2124" stroke-width="1.4" stroke-linecap="round" opacity=".35"/>
  <path d="M0 246 C 360 214 620 280 880 248 S 1250 194 1440 208 V300 H0 Z" fill="url(#floor)"/>
  <path d="M0 246 C 360 214 620 280 880 248 S 1250 194 1440 208" fill="none" stroke="#fbfaf6" stroke-width="2" opacity=".9"/>
  <g fill="none" stroke="#3a3f45" stroke-linecap="round" opacity=".6">
    <path d="M160 272 C 360 262 560 270 760 264" stroke-width="1.5"/>
    <path d="M760 264 C 860 260 940 244 1040 240 C 1110 237 1170 232 1220 228" stroke-width="1.3"/>
